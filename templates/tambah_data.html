<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambah Data</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>

    <form action="/tambahdata" method="post" class="max-w-md mx-auto p-6 bg-white rounded-lg shadow-md">
        <div class="mb-4">
            <label for="ayat" class="block text-gray-700 font-semibold mb-2">Teks Ayat:</label>
            <textarea id="ayat" name="ayat" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
        </div>
        <div class="mb-6">
            <label for="terjemah" class="block text-gray-700 font-semibold mb-2">Terjemah:</label>
            <textarea id="terjemah" name="terjemah" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
        </div>
        <button type="submit" class="w-full bg-blue-500 hover:bg-blue-600 text-white font-semibold py-2 px-4 rounded-lg transition duration-200">Simpan</button>
    </form>
</body>
</html>
