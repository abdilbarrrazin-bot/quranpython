<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tampilkan Data</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-4xl font-bold text-gray-800 mb-8">Welcome to alFatihah website</h1>
        <div class="overflow-x-auto bg-white rounded-lg shadow">
            <table class="w-full border-collapse">
                <thead>
                    <tr class="bg-blue-600 text-white">
                        <th class="px-6 py-3 text-left font-semibold">No</th>
                        <th class="px-6 py-3 text-left font-semibold">Ayat</th>
                        <th class="px-6 py-3 text-left font-semibold">Terjemah</th>
                    </tr>
                </thead>
                <tbody>
                    {% for verse in verses %}
                    <tr class="border-b hover:bg-gray-50">
                        <td class="px-6 py-4 text-gray-900">{{ verse[0] }}</td>
                        <td class="px-6 py-4 text-gray-900 text-right font-arabic text-xl leading-relaxed">{{ verse[1] }}</td>
                        <td class="px-6 py-4 text-gray-700">{{ verse[2] }}</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>

</body>
</html>
