<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surah al Fatihah</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        arabic: ['Amiri', 'serif'],



                    }


                }


            }



        }



    </script>


</head>

<body class="bg-gray-50 min-h-screen py-10 px-4 antialiased">

    <main class="max-w-4x1 mx-auto bg-white shadow-sm rounded-x1 border border-gray-200 p-6 overflow-hidden">

        <div class="bg-gray-100 border-b border-gray-200 p-6 text-center">
            <h1 class="text-2x1 font-bold text-gray-800">Surah al Fatihah</h1>
            <p class="text-gray-500 text-sm mt-1">Al Fatihah</p>

        </div>

        <div class="p-6 md:p-10 space-y-8">

            {% for ayat in verses %}
            <div class="flex flex-col border-b border-gray-100 pb-8 last:border-0 last:pb-0">

                <div class="flex flex-row-reverse items-start gap-4" dir="rtl">

                    <div class="flex-shrink-0 mt-2">
                        <span
                            class="inline-flex items-center justify-center w-10 h-10 rounded-full bg-gray-100 text-gray-600 text-sm font-sans font-bold border border-gray-200">
                            {{ ayat.nomor }}


                        </span>


                    </div>

                    <p class="w-full text-right font-arabic text-4x1 md:text-5x1 leading-[2.3] text-gray-900">

                        {{ ayat.terjemah }}
                    </p>

                </div>

            </div>
            {% endfor %}

        </div>
    </main>
</body>

















</html>
